<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般常識クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
      <h1 class="app-title">一般常識クイズ</h1>
      <p class="description">全10問・4択形式<br>あなたの一般常識を試してみよう！</p>
      <button id="start-btn" class="btn">スタート</button>
    </div>

    <!-- 問題画面 -->
    <div id="quiz-screen" class="screen hidden">
      <div class="progress-area">
        <span id="progress-text">問題 1 / 5</span>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <div class="card">
        <p id="question-text" class="question-text"></p>
        <div id="choices" class="choices"></div>
        <div id="feedback" class="feedback hidden"></div>
        <button id="next-btn" class="btn hidden">次の問題へ →</button>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen hidden">
      <div class="card result-card">
        <h2 class="result-title">クイズ終了！</h2>
        <div class="score-circle">
          <span id="score-number" class="score-number"></span>
          <span class="score-label">/ 10問</span>
        </div>
        <p id="result-message" class="result-message"></p>
        <button id="retry-btn" class="btn">もう一度挑戦する</button>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
